version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: taskflow-postgres-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: task_manager_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - taskflow-network-dev

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: taskflow-app-dev
    environment:
      DATABASE_URL: postgresql://postgres:1234@postgres:5432/task_manager_db?schema=public
      JWT_SECRET: devsecretkey
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    networks:
      - taskflow-network-dev
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "pnpm exec prisma generate && pnpm dev"

volumes:
  postgres_dev_data:

networks:
  taskflow-network-dev:
    driver: bridge